<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>运营看板</title>
<style>
  :root { color-scheme: light; --ink:#111827; --muted:#6b7280; --line:#e7e8ec; --canvas:#f5f6f8; --blue:#2563eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--canvas); color: var(--ink); font: 14px/1.5 Inter, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  a { color: var(--blue); }
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
  .nav { background: #fff; border-right: 1px solid var(--line); padding: 20px 12px 24px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 16px; }
  .mark { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--blue); color: #fff; font-weight: 700; }
  .brand strong { display: block; font-size: 14px; }
  .brand small, .foot { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .nav button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; color: #374151; }
  .nav button.on, .nav button:hover { background: #f3f4f6; color: var(--ink); }
  .foot { margin-top: auto; padding: 14px 8px 0; }
  .main { padding: 28px 32px 64px; max-width: 1180px; }
  .head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 22px; }
  .head h1 { font-size: 26px; font-weight: 650; letter-spacing: -.03em; }
  .head p { margin-top: 6px; max-width: 720px; color: #374151; font-size: 15px; }
  .asof { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1.3fr .7fr; gap: 16px; }
  .grid2.even { grid-template-columns: 1fr 1fr; }
  .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .metric { padding: 16px 16px 12px; }
  .metric .k { color: var(--muted); font-size: 13px; }
  .metric .n { margin: 6px 0 8px; font-size: 30px; font-weight: 640; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .metric.other { box-shadow: inset 3px 0 0 var(--blue); }
  .card-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 18px 18px 0; }
  .card-h h2 { font-size: 15px; font-weight: 650; }
  .card-h p, .note, .readout { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .plot { padding: 4px 18px 16px; }
  .readout { min-height: 18px; margin: 10px 0 4px; color: #111827; font-variant-numeric: tabular-nums; }
  .plot svg { width: 100%; height: 220px; display: block; }
  .xlabels { display: grid; grid-template-columns: 8.125% minmax(0,1fr) 2.8125%; height: 18px; margin-top: 4px; color: var(--muted); font-size: 11px; }
  .xlabels .ticks { position: relative; min-width: 0; }
  .xlabels .ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .when { white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 4px 18px 16px; }
  .legend button, .chips button { border: 0; background: transparent; padding: 0; }
  .swatch { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  .donut-wrap { display: grid; grid-template-columns: 210px 1fr; gap: 8px; align-items: center; padding: 8px 18px 18px; }
  .donut-wrap svg { width: 190px; height: 190px; }
  .legend.stack { display: grid; padding: 0; }
  .legend.stack div, .legend.stack button { display: grid; grid-template-columns: 10px minmax(72px, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; text-align: left; }
  .legend.stack span { white-space: nowrap; }
  .filters, .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .filters label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .filters input, .filters select, .search { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 10px; min-width: 180px; }
  .chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  .chips button.on { background: #111827; color: #fff; border-color: #111827; }
  .table-wrap { overflow: auto; max-height: 640px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid #f1f2f4; font-size: 13px; vertical-align: top; }
  th { color: var(--muted); font-size: 12px; font-weight: 550; position: sticky; top: 0; background: #fff; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f8fafc; }
  .clip { max-width: 340px; }
  .url { word-break: break-all; }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 650; background: #f3f4f6; white-space: nowrap; }
  .L1, .seen { background: #dbeafe; color: #1d4ed8; }
  .open { background: #dbeafe; color: #1d4ed8; }
  .issued { background: #d1fae5; color: #047857; }
  .done { background: #ecfdf5; color: #065f46; }
  .cancelled { background: #f3f4f6; color: #6b7280; }
  .banner { margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; background: #fff7ed; color: #9a3412; }
  .empty { min-height: 180px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 28px; }
  .glossary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .glossary article { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .glossary strong { display: block; font-size: 13px; }
  .glossary span { color: var(--muted); font-size: 12px; }
  .backdrop { position: fixed; inset: 0; background: rgba(17,24,39,.32); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; z-index: 50; width: min(560px, 100vw); height: 100vh; overflow: auto; background: #fff; border-left: 1px solid var(--line); box-shadow: -16px 0 40px rgba(0,0,0,.12); padding: 22px 22px 56px; }
  .drawer header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .drawer h2 { font-size: 20px; letter-spacing: -.02em; }
  .close { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; }
  .section { margin-top: 20px; }
  .section h3 { font-size: 13px; margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 7px 12px; font-size: 13px; }
  .kv b { color: var(--muted); font-weight: 550; }
  .prose { white-space: pre-wrap; background: #f8fafc; border-radius: 10px; padding: 12px; }
  .item { border-top: 1px solid #f1f2f4; padding: 12px 0; }
  .item strong { display: block; }
  .specs { margin: 8px 0 0; padding-left: 18px; color: #374151; }
  .err { padding: 28px; }
  #tip { position: fixed; z-index: 80; display: none; pointer-events: none; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: #111827; color: #fff; font-size: 12px; line-height: 1.45; white-space: pre-wrap; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  #tip.show { display: block; }
  @media (max-width: 1100px) {
    .app, .grid2, .grid2.even, .metrics, .donut-wrap, .glossary { grid-template-columns: 1fr; }
    .nav { position: static; height: auto; }
  }
</style>
</head>
<body>
<div id="app" class="err">正在读本地导出…</div>
<div id="tip"></div>
<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden></aside>
<script>
const PAGES = [["overview","总览"],["quality","质量"],["pace","节奏"],["inquiries","询盘"],["actions","动作"],["trend","趋势"],["pages","收录"],["later","还没接上"]];
const COLORS = ["#2563eb","#0ea5e9","#6366f1","#94a3b8","#f59e0b","#10b981","#f97316","#14b8a6"];
const LEVEL = {
  L0: ["已执行", "做了，搜索还没看到这一页。"],
  "未到 L1": ["还没被看到", "检查过，但还没进搜索结果。"],
  L1: ["已被看到", "已收录，或搜索结果里已经有展示。"],
  L2: ["有互动", "有人从搜索点进来，或邮件有了回复。"],
  L3: ["有转化", "有询盘归因到这次动作。"]
};
let DATA = null;
let screen = (location.hash || "#overview").slice(1).split("/")[0];
if (!PAGES.some(([id]) => id === screen)) screen = "overview";
let filterState = {date:"", country:"", device:"", type:"", q:"", status:""};

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function attr(s) { return esc(s).replace(/\n/g, "&#10;"); }
function n(v) { return v == null || v === "" ? "—" : v; }
function levelName(level) { const pair = LEVEL[level]; return pair ? pair[0] + " · " + level : (level || "—"); }
function levelHint(level) { const pair = LEVEL[level]; return pair ? pair[0] + "（" + level + "）：" + pair[1] : (level || "没有级别"); }
function pct(part, total) { return total ? Math.round(part / total * 100) : 0; }
function money(row) { return row.total ? ((row.currency || "") + " " + row.total).trim() : "—"; }
function shortUrl(url) {
  try { const u = new URL(url); return (u.pathname && u.pathname !== "/" ? u.pathname : u.host); }
  catch { return url || "—"; }
}
function link(url, label) {
  if (!url) return "—";
  return `<a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label || url)}</a>`;
}
function fieldLabel(label) { return String(label || "").replaceAll("_", " "); }
function askOf(row) {
  const items = row.items || [];
  if (items.length) return items.map(it => it.name + (it.quantity != null && it.quantity !== "" ? " × " + it.quantity : "")).join("；");
  return row.note || row.project || row.topic || "这单没有行项目，也没有备注";
}
function statusClass(status) {
  if (status === "询盘已收到") return "open";
  if (status === "形式发票已开") return "issued";
  if (status === "已完成") return "done";
  if (status === "已取消") return "cancelled";
  return "";
}
function pill(text, cls) { return text ? `<span class="pill ${esc(cls || "")}">${esc(text)}</span>` : "—"; }
function openAttr(kind, id) { return kind + ":" + encodeURIComponent(id); }
function shell(title, lede, body) {
  const nav = PAGES.map(([id, label]) => `<button type="button" data-screen="${id}" class="${screen===id?"on":""}">${label}</button>`).join("");
  return `<div class="app"><aside class="nav"><div class="brand"><span class="mark">D</span><span><strong>运营看板</strong><small>本机，含申请正文</small></span></div>${nav}<div class="foot">导出 ${esc(DATA.exportedAt)}<br>点开一行看全文<br>正文不写回底表</div></aside><div class="main"><header class="head"><div><h1>${title}</h1><p>${lede}</p></div><div class="asof">导出 ${esc(DATA.exportedAt)}</div></header>${body}</div></div>`;
}
function card(title, note, inner) {
  return `<section class="card"><div class="card-h"><div><h2>${title}</h2><p>${note}</p></div></div>${inner}</section>`;
}
function axisTicks(maxValue) {
  const max = Math.max(0, maxValue);
  if (max <= 4) return {top: 4, values: [0, 1, 2, 3, 4]};
  const rough = max / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 5, 10].map(c => c * pow).find(s => s >= rough) || rough;
  const top = step * Math.ceil(max / step);
  const values = [];
  for (let v = 0; v <= top + 0.01; v += step) values.push(Math.round(v));
  return {top, values};
}
function tickIndexes(count, maxTicks) {
  if (count <= maxTicks) return [...Array(count).keys()];
  const out = [];
  for (let i = 0; i < maxTicks; i++) out.push(Math.round(i * (count - 1) / (maxTicks - 1)));
  return [...new Set(out)];
}
function axisRow(count, entries) {
  const marks = entries.map(e => `<span style="left:${((e.i + 0.5) / Math.max(1, count)) * 100}%">${esc(e.label)}</span>`).join("");
  return `<div class="xlabels"><span></span><span class="ticks">${marks}</span><span></span></div>`;
}
function columns(items) {
  const rows = items.length ? items : [{label:"无", value:0}];
  const w = 640, h = 220, l = 52, r = 18, t = 22, b = 8;
  const scale = axisTicks(Math.max(0, ...rows.map(i => Number(i.value) || 0)));
  const innerW = w - l - r, innerH = h - t - b;
  const slot = innerW / Math.max(1, rows.length);
  const bw = Math.max(4, Math.min(36, slot * 0.62));
  const grids = scale.values.map(v => {
    const y = t + innerH - (v / scale.top) * innerH;
    return `<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="#f3f4f6"/><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#9ca3af">${v}</text>`;
  }).join("");
  const bars = rows.map((it, i) => {
    const value = Number(it.value) || 0;
    const bh = value ? Math.max(3, value / scale.top * innerH) : 0;
    const x = l + i * slot + (slot - bw) / 2;
    const y = t + innerH - bh;
    const tip = (it.full || it.label) + "\n" + value + (it.unit || "");
    const valueLabel = rows.length <= 14 && value ? `<text x="${x+bw/2}" y="${Math.max(12, y-6)}" text-anchor="middle" font-size="11" fill="#374151">${value}</text>` : "";
    const open = it.open ? ` data-open="${esc(it.open)}"` : "";
    return `<g data-tip="${attr(tip)}"${open}><rect x="${l + i * slot}" y="${t}" width="${slot}" height="${innerH}" fill="transparent"/><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${it.color || "#2563eb"}"/>${valueLabel}</g>`;
  }).join("");
  const labels = tickIndexes(rows.length, 6).map(i => ({i, label: rows[i].label}));
  return `<div class="plot" data-plot><div class="readout">悬停看具体数字</div><svg viewBox="0 0 ${w} ${h}" role="img">${grids}<line x1="${l}" x2="${w-r}" y1="${t+innerH}" y2="${t+innerH}" stroke="#e5e7eb"/>${bars}</svg>${axisRow(rows.length, labels)}</div>`;
}
function lines(series, categories, tips) {
  const w = 640, h = 220, l = 52, r = 18, t = 18, b = 8;
  const innerW = w - l - r, innerH = h - t - b;
  const scale = axisTicks(Math.max(0, ...series.flatMap(s => s.values)));
  const slot = innerW / Math.max(1, categories.length);
  const xs = categories.map((_, i) => l + slot * i + slot / 2);
  const grids = scale.values.map(v => {
    const y = t + innerH - (v / scale.top) * innerH;
    return `<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="#f3f4f6"/><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#9ca3af">${v}</text>`;
  }).join("");
  const polys = series.map(s => `<polyline points="${s.values.map((v, i) => xs[i] + "," + (t + innerH - (v / scale.top) * innerH)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  const hits = categories.map((c, i) => {
    const tip = (tips && tips[i]) || (c + "\n" + series.map(s => s.name + "：" + s.values[i]).join("\n"));
    const dots = series.map(s => `<circle cx="${xs[i]}" cy="${t + innerH - (s.values[i] / scale.top) * innerH}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join("");
    return `<g data-tip="${attr(tip)}"><rect x="${l + i * slot}" y="${t}" width="${slot}" height="${innerH}" fill="transparent"/>${dots}</g>`;
  }).join("");
  const labels = tickIndexes(categories.length, 6).map(i => ({i, label: categories[i]}));
  const legend = series.map(s => `<span><i class="swatch" style="background:${s.color}"></i> ${esc(s.name)}</span>`).join("");
  return `<div class="plot" data-plot><div class="readout">悬停看具体数字</div><svg viewBox="0 0 ${w} ${h}" role="img">${grids}<line x1="${l}" x2="${w-r}" y1="${t+innerH}" y2="${t+innerH}" stroke="#e5e7eb"/>${polys}${hits}</svg>${axisRow(categories.length, labels)}</div><div class="legend">${legend}</div>`;
}
function donut(items, center, sub) {
  const total = items.reduce((s, i) => s + i.value, 0) || 1;
  const r = 58, c = 2 * Math.PI * r;
  let off = 0;
  const slices = items.filter(i => i.value).map(i => {
    const share = i.value / total;
    const len = Math.max(1, share * c - 2);
    const tip = i.label + "\n" + i.value + "（" + pct(i.value, total) + "%）";
    const el = `<circle data-tip="${attr(tip)}" data-status="${esc(i.status || "")}" cx="90" cy="90" r="${r}" fill="none" stroke="${i.color}" stroke-width="22" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" pointer-events="stroke"/>`;
    off += share * c;
    return el;
  }).join("");
  const legend = items.map(i => `<button type="button" data-tip="${attr(i.label + "\n" + i.value + "（" + pct(i.value, total) + "%）")}" data-status="${esc(i.status || "")}"><i class="swatch" style="background:${i.color}"></i><span>${esc(i.label)}</span><b>${i.value}</b></button>`).join("");
  return `<div class="plot" data-plot><div class="readout">悬停看具体数字。点一块可筛下面的表。</div><div class="donut-wrap"><svg viewBox="0 0 180 180">${slices}<text x="90" y="86" text-anchor="middle" font-size="26" font-weight="650" fill="#111827">${esc(center)}</text><text x="90" y="106" text-anchor="middle" font-size="11" fill="#6b7280">${esc(sub)}</text></svg><div class="legend stack">${legend}</div></div></div>`;
}
function spark(values) {
  const nums = values.length ? values : [0];
  const max = Math.max(1, ...nums);
  return `<svg viewBox="0 0 92 32" width="92" height="32" aria-hidden="true">${nums.slice(-10).map((v,i,arr) => {
    const bh = Math.max(3, v / max * 26);
    return `<rect x="${i*9}" y="${30-bh}" width="6" height="${bh}" rx="1.5" fill="${v && i===arr.length-1?"#2563eb":"#dbe3ee"}"/>`;
  }).join("")}</svg>`;
}
function metric(label, value, values, extra) {
  return `<article class="card metric${extra||""}"><div class="k">${label}</div><div class="n">${value}</div>${spark(values)}</article>`;
}
function table(headers, rows) {
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${headers.length}">没有匹配的行</td></tr>`}</tbody></table></div>`;
}
function matches(text) {
  const q = filterState.q.trim().toLowerCase();
  return !q || String(text || "").toLowerCase().includes(q);
}
function inquiryItems() { return DATA.inquiries.items || []; }
function sentence() {
  const d = DATA, q = d.inquiries;
  const open = (q.items || []).filter(r => r.status === "询盘已收到").length || q.byStatus["询盘已收到"] || 0;
  return `${d.ladder.L0} 次已经做了，${pct(d.ladder.L1, d.ladder.L0)}% 被看到。有互动 ${d.ladder.L2}，有转化 ${d.ladder.L3}。申请 ${q.items ? q.items.length : q.total} 笔，仍在流程的 ${open} 笔。点进询盘看申请了什么。`;
}
function overview() {
  const d = DATA;
  const byDay = {};
  d.actions.forEach(row => { if (row.date) byDay[row.date] = (byDay[row.date] || 0) + 1; });
  const dayRows = Object.entries(byDay).sort().map(([date, value]) => ({label: date.slice(5), full: date, value, unit:" 次", color:"#2563eb"}));
  const sparkDays = (dayRows.length ? dayRows : [{value:0}]).map(x => x.value);
  const reached = d.ladder.L1, missed = Math.max(0, d.ladder.L0 - d.ladder.L1);
  const cards = [
    metric("已执行", d.ladder.L0, sparkDays),
    metric("已被看到", d.ladder.L1, [missed, reached]),
    metric("有互动", d.ladder.L2, [0, d.ladder.L2]),
    metric("有转化", d.ladder.L3, [0, d.ladder.L3]),
    metric("申请", inquiryItems().length || d.inquiries.total, inquiryItems().map(() => 1).slice(-6), " other")
  ].join("");
  const recent = d.actions.slice(0, 6).map(row => `<tr class="clickable" data-open="${esc(openAttr("act", row.id))}"><td class="when">${esc(row.date)}</td><td>${esc(row.action)}</td><td class="clip">${esc(row.summary || "没有内容说明")}</td><td>${pill(levelName(row.level), row.level)}</td></tr>`);

  const el = e.target.closest("[data-filter]");
  if (!el) return;
  filterState[el.dataset.filter] = el.value;
  render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") hideDetail(); });
fetch("/data.json", {cache:"no-store"}).then(r => { if (!r.ok) throw new Error("还没有导出"); return r.json(); }).then(d => { DATA = d; render(); }).catch(err => {
  document.getElementById("app").textContent = "读不到本地导出。先运行 uv run scripts/dashboard.py export。 " + err.message;
});
